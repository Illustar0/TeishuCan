name: teishucan
description: "Cross-platform Flutter client for Zhengzhou University services, powered by libzzu."
publish_to: 'none'
version: 0.3.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.7
  flutter_secure_storage: ^9.2.4
  intl: any
  libzzu_ffi:
    path: packages/libzzu_ffi
  material_ui: ^1.11.1
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  archive: ^4.0.0
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
