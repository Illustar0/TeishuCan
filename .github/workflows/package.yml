name: Package

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to create locally before building so Gradle derives a release versionName; empty builds a development version
        type: string
        default: ""
    outputs:
      artifact-pattern:
        description: Glob pattern that matches the names of the uploaded APK artifacts, one per APK
        value: ${{ jobs.package.outputs.artifact-pattern }}
      version:
        description: versionName of the packaged APKs
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 签名用的 secrets 只放在这个 environment 里，并在仓库设置中限制为只有 main 分支能使用。
    environment: signing

    outputs:
      artifact-pattern: TeishuCan-${{ steps.collect.outputs.version }}-*.apk
      version: ${{ steps.collect.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode 与 versionName 由 Gradle 根据完整的提交历史和 tag 计算。
          fetch-depth: 0
          persist-credentials: false

      # 只在本地打 tag，让 Gradle 算出正式版的 versionName；远端 tag 由 Release workflow 创建 GitHub Release 时生成。
      - name: Tag release commit locally
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: git tag "$TAG"

      # 开发构建的 versionName 由 Gradle 调用 git-cliff 算出。
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APKs
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect APKs
        id: collect
        run: .github/scripts/collect-apks.sh dist

      # 下面的上传步骤每个只传一个 ABI 的 APK，各自找不到文件时会失败；
      # 这里再核对总数，splits.abi 新增 ABI 却没补上传步骤时就会报错，不会悄悄漏传。
      - name: Check APK count
        run: |
          apks=(dist/*.apk)
          if [ "${#apks[@]}" -ne 5 ]; then
            echo "::error::Expected 5 APKs but found ${#apks[@]}: ${apks[*]}. Keep the upload steps in sync with splits.abi."
            exit 1
          fi

      # 每个 APK 单独上传且不套 zip，用户只下载自己架构的那个，下载到的直接就是 APK。
      # archive 为 false 时一次只能传一个文件，所以每个 ABI 一个步骤，列表要与 app/build.gradle.kts 的 splits.abi 保持一致。
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86.apk
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-universal.apk
          archive: false
          if-no-files-found: error
