name: CI

on:
  push:
    branches:
      - flutter
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu Linux binary
        run: dart run tool/fetch_libzzu.dart --target linux

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Analyze FFI plugin and fetch tool
        run: dart analyze packages/libzzu_ffi tool/fetch_libzzu.dart

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Run libzzu native FFI tests
        env:
          LIBZZU_LIBRARY_PATH: ${{ github.workspace }}/build/libzzu/linux/libzzu.so
        run: flutter test packages/libzzu_ffi/test/libzzu_ffi_test.dart

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu Android binaries
        run: dart run tool/fetch_libzzu.dart --target android

      - name: Build Android release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: teishucan-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu iOS XCFramework
        run: dart run tool/fetch_libzzu.dart --target ios

      - name: Build iOS unsigned release app
        run: flutter build ios --release --no-codesign

      - name: Verify libzzu symbols are linked
        run: |
          target=""
          for candidate in \
            "build/ios/iphoneos/Runner.app/Frameworks/libzzu_ffi.framework/libzzu_ffi" \
            "build/ios/iphoneos/Runner.app/Runner"; do
            if [ -f "$candidate" ] && nm -gU "$candidate" | grep -q "zzu_abi_version"; then
              target="$candidate"
              break
            fi
          done
          if [ -z "$target" ]; then
            echo "ERROR: zzu_abi_version symbol was stripped or missing from Runner.app"
            exit 1
          fi
          echo "Checking required exported symbols in $target"
          for sym in zzu_abi_version zzu_runtime_new zzu_cas_call zzu_timetable_to_calendar; do
            if ! nm -gU "$target" | grep -q "$sym"; then
              echo "ERROR: $sym missing from $target"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: teishucan-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
