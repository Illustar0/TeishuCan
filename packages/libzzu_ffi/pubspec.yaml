name: libzzu_ffi
description: Dart FFI bindings and Flutter plugin for libzzu (Zhengzhou University services SDK).
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.illustar0.libzzu_ffi
        pluginClass: LibzzuFfiPlugin
      ios:
        pluginClass: LibzzuFfiPlugin
