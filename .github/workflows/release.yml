name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # versionCode 取 main 的提交数，从其他分支发版会让它失去可比性。
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched from main."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Calculate next version
        id: version
        run: |
          tag="$(git cliff --bumped-version)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; there are no releasable commits since it."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: git cliff --unreleased --tag "${{ steps.version.outputs.tag }}" --output release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  package:
    needs: prepare
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 工作区不干净或本地 tag 没生效时，versionName 会带上 -dev 或 +dirty，不能当正式版发布。
      - name: Check packaged version
        if: needs.package.outputs.version != needs.prepare.outputs.version
        run: |
          echo "::error::Packaged versionName ${{ needs.package.outputs.version }} does not match ${{ needs.prepare.outputs.version }}."
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: dist/*.apk
          fail_on_unmatched_files: true
