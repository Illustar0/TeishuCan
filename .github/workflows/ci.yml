name: CI

on:
  push:
    branches:
      - flutter
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu Linux binary
        run: dart run tool/fetch_libzzu.dart --target linux

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Analyze FFI plugin and fetch tool
        run: dart analyze packages/libzzu_ffi tool/fetch_libzzu.dart

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Run libzzu native FFI tests
        env:
          LIBZZU_LIBRARY_PATH: ${{ github.workspace }}/build/libzzu/linux/libzzu.so
        run: flutter test packages/libzzu_ffi/test/libzzu_ffi_test.dart

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu Android binaries
        run: dart run tool/fetch_libzzu.dart --target android

      - name: Build Android release APKs
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: teishucan-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch libzzu iOS XCFramework
        run: dart run tool/fetch_libzzu.dart --target ios

      - name: Build iOS unsigned release app
        run: flutter build ios --release --no-codesign

      - name: Verify libzzu symbols are linked
        run: |
          found=0
          if [ -f "build/ios/iphoneos/Runner.app/Frameworks/libzzu_ffi.framework/libzzu_ffi" ]; then
            if nm -gU "build/ios/iphoneos/Runner.app/Frameworks/libzzu_ffi.framework/libzzu_ffi" | grep -q "zzu_abi_version"; then
              echo "Found zzu_abi_version in libzzu_ffi.framework"
              found=1
            fi
          fi
          if [ -f "build/ios/iphoneos/Runner.app/Runner" ]; then
            if nm -gU "build/ios/iphoneos/Runner.app/Runner" | grep -q "zzu_abi_version"; then
              echo "Found zzu_abi_version in Runner binary"
              found=1
            fi
          fi
          if [ "$found" -ne 1 ]; then
            echo "ERROR: zzu_abi_version symbol was stripped or missing from Runner.app"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: teishucan-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
