name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode 与 versionName 由 Gradle 根据完整的提交历史和 tag 计算。
          fetch-depth: 0
          persist-credentials: false

      # 开发构建的 versionName 由 Gradle 调用 git-cliff 算出。
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check
        run: ./gradlew --continue :app:detekt :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

  # 只给 main 的构建签名并上传，其他分支和 PR 拿不到签名用的 secrets。
  package:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/package.yml
    secrets: inherit
